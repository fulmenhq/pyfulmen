[mypy]
python_version = 3.12
files = src/pyfulmen
ignore_missing_imports = True
warn_unused_configs = True
warn_unused_ignores = False
no_implicit_optional = True
check_untyped_defs = False

# --- Baseline burn-down list (W3): modules with pre-existing errors ---
# Remove entries as modules are cleaned up; do not add new entries.

[mypy-pyfulmen.logging.logger]
ignore_errors = True

[mypy-pyfulmen.logging.middleware]
ignore_errors = True

[mypy-pyfulmen.logging._telemetry]
ignore_errors = True

[mypy-pyfulmen.logging.profiles]
ignore_errors = True

[mypy-pyfulmen.logging._models]
ignore_errors = True

[mypy-pyfulmen.fulhash.models]
ignore_errors = True

[mypy-pyfulmen.fulhash._stream]
ignore_errors = True

[mypy-pyfulmen.fulhash._hash]
ignore_errors = True

[mypy-pyfulmen.error_handling._validate]
ignore_errors = True

[mypy-pyfulmen.pathfinder.models]
ignore_errors = True

[mypy-pyfulmen.foundry.mime_detection]
ignore_errors = True

[mypy-pyfulmen.foundry.catalog]
ignore_errors = True

[mypy-pyfulmen.foundry.models]
ignore_errors = True

[mypy-pyfulmen.crucible.bridge]
ignore_errors = True

[mypy-pyfulmen.schema.export]
ignore_errors = True

[mypy-pyfulmen.schema.cli.validate]
ignore_errors = True

[mypy-pyfulmen.schema.cli.__main__]
ignore_errors = True

[mypy-pyfulmen.fulpack.security]
ignore_errors = True

[mypy-pyfulmen.docscribe._formats]
ignore_errors = True

[mypy-pyfulmen.appidentity._cache]
ignore_errors = True
