version: v1.1.0
sources:
  - name: crucible
    repo: fulmenhq/crucible
    ref: v0.4.15
    sync_path_base: lang/python
    force_remote: true
    assets:
      - type: doc
        source_path: docs
        paths:
          - 'architecture/**/*.md'
          - 'standards/**/*.md'
          - 'guides/**/*.md'
          - 'sop/**/*.md'
        subdir: docs/crucible-py
      - type: schema
        source_path: schemas
        # Enumerated includes: everything except the re-vendored upstream/** tree,
        # which must not land in this repo or its distributions. The sync format
        # has no exclude support, so new top-level schema dirs upstream must be
        # added here explicitly.
        paths:
          - 'ascii/**'
          - 'assessment/**'
          - 'config/**'
          - 'content/**'
          - 'design/**'
          - 'devsecops/**'
          - 'enact/**'
          - 'error-handling/**'
          - 'library/**'
          - 'meta/**'
          - 'observability/**'
          - 'pathfinder/**'
          - 'protocol/**'
          - 'schema-validation/**'
          - 'server/**'
          - 'standards/**'
          - 'taxonomy/**'
          - 'terminal/**'
          - 'tooling/**'
          - 'web/**'
        subdir: schemas/crucible-py
      - type: config
        source_path: config
        paths:
          - '**/*'
        subdir: config/crucible-py
      - type: metadata
        source_path: config/sync
        paths:
          - '**/*'
        subdir: .crucible/metadata
      # Sync all Crucible Python source assets
      - type: src
        source_path: src/crucible
        paths:
          - '**/*.py'
        subdir: src/crucible
strategy:
  on_conflict: overwrite
  prune_stale: false
  verify_checksums: false
